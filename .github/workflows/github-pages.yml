name: Publish Terms

on:
  push:
    tags:
      - 'element-a/*'        # element-a: una versión por carpeta (e.g., element-a/1)
      - 'element-b/*/v*'     # element-b: versiones por release (e.g., element-b/1/v1.0.0)
      - 'general/v*'         # general: versiones por release (e.g., general/v1.0.0)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          touch public/.nojekyll

          ref="${GITHUB_REF_NAME}"

          if [[ "$ref" == general/v* ]]; then
            version="${ref#general/}"  # vX.Y.Z

            # Inmutable por versión
            mkdir -p "public/general/versions/${version}"
            cp -f "general/terms.md" "public/general/versions/${version}/terms.md"

            # Última (sin versión en el path)
            cp -f "public/general/versions/${version}/terms.md" "public/general/terms.md"
            printf '%s\n' "${version}" > "public/general/version.txt"

          elif [[ "$ref" == element-b/*/v* ]]; then
            folder="$(echo "$ref" | cut -d'/' -f2)"
            version="$(echo "$ref" | cut -d'/' -f3)"  # vX.Y.Z

            # Inmutable por versión
            mkdir -p "public/element-b/${folder}/versions/${version}"
            cp -f "element-b/${folder}/terms.md" "public/element-b/${folder}/versions/${version}/terms.md"

            # Última (sin versión en el path)
            cp -f "public/element-b/${folder}/versions/${version}/terms.md" "public/element-b/${folder}/terms.md"
            printf '%s\n' "${version}" > "public/element-b/${folder}/version.txt"

          elif [[ "$ref" == element-a/* ]]; then
            folder="${ref#element-a/}"

            # Vigente por folder (sin versionado)
            mkdir -p "public/element-a/${folder}"
            cp -f "element-a/${folder}/terms.md" "public/element-a/${folder}/terms.md"

          else
            echo "Tag no reconocido: ${ref}" >&2
            exit 1
          fi

      - name: Compute integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE_URL="https://${OWNER}.github.io/${REPO}"

          if [[ "$ref" == general/v* ]]; then
            version="${ref#general/}"
            source_file="general/terms.md"
            terms_file="public/general/versions/${version}/terms.md"
            version_dir="public/general/versions/${version}"
            latest_dir="public/general"
            element="general"

          elif [[ "$ref" == element-b/*/v* ]]; then
            folder="$(echo "$ref" | cut -d'/' -f2)"
            version="$(echo "$ref" | cut -d'/' -f3)"
            source_file="element-b/${folder}/terms.md"
            terms_file="public/element-b/${folder}/versions/${version}/terms.md"
            version_dir="public/element-b/${folder}/versions/${version}"
            latest_dir="public/element-b/${folder}"
            element="element-b"

          elif [[ "$ref" == element-a/* ]]; then
            folder="${ref#element-a/}"
            source_file="element-a/${folder}/terms.md"
            terms_file="public/element-a/${folder}/terms.md"
            version_dir="public/element-a/${folder}"
            latest_dir=""
            element="element-a"
            version="${folder}"
          fi

          [[ -f "$terms_file" ]] || { echo "Terms file not found: $terms_file" >&2; exit 1; }
          sed -i 's/\r$//' "$terms_file"

          # Calculate git hash
          git_hash=$(git hash-object "$source_file")
          
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REL_PATH="${terms_file#public/}"
          URL="${BASE_URL}/${REL_PATH}"

          cat > "${version_dir}/integrity.json" <<EOF
          {
            "element": "${element}",
            "version": "${version}",
            "url": "${URL}",
            "mimetype": "text/markdown",
            "gitHash": "${git_hash}",
            "createdAt": "${TS}"
          }
          EOF

          if [[ -n "${latest_dir}" ]]; then
            cp -f "${version_dir}/integrity.json" "${latest_dir}/integrity.json"
          fi

      - name: Deploy to gh-pages (keep history)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          keep_files: true