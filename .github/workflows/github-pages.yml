name: Deploy GitHub Pages

on:
  push:
    tags:
      - 'element-a/*'        # element-a: una versión por carpeta (e.g., element-a/1)
      - 'element-b/*/v*'     # element-b: versiones por release (e.g., element-b/1/v1.0.0)
      - 'general/v*'         # general: versiones por release (e.g., general/v1.0.0)

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare versioned paths
        if: startsWith(github.ref, 'refs/tags/general/') || startsWith(github.ref, 'refs/tags/element-b/')
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"  # p.ej: general/v1.2.3 | element-b/2/v1.0.0
          if [[ "$ref" == general/* ]]; then
            version="${ref#general/}"
            mkdir -p "general/versions/${version}"
            cp -f "general/terms.md" "general/versions/${version}/terms.md"
            mkdir -p "general/versions/latest"
            cp -f "general/terms.md" "general/versions/latest/terms.md"
          elif [[ "$ref" == element-b/*/v* ]]; then
            folder="$(echo "$ref" | cut -d'/' -f2)"
            version="$(echo "$ref" | cut -d'/' -f3)"
            mkdir -p "element-b/${folder}/versions/${version}"
            cp -f "element-b/${folder}/terms.md" "element-b/${folder}/versions/${version}/terms.md"
            mkdir -p "element-b/${folder}/versions/latest"
            cp -f "element-b/${folder}/terms.md" "element-b/${folder}/versions/latest/terms.md"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4