name: Publish versioned Terms (incremental)

on:
  push:
    tags:
      - 'element-a/*'        # ej: element-a/abc123
      - 'element-b/*/v*'     # ej: element-b/abc123/v1.0.0
      - 'general/v*'         # ej: general/v1.2.3
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare versioned paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          ref="${GITHUB_REF_NAME}"  # p.ej: general/v1.2.3 | element-b/abc123/v1.0.0 | element-a/abc123

          if [[ "$ref" == general/v* ]]; then
            version="${ref#general/}"      # v1.2.3
            mkdir -p "public/general/versions/${version}"
            cp -f "general/terms.md" "public/general/versions/${version}/terms.md"
            echo "${version}" > "public/general/VERSION"

          elif [[ "$ref" == element-b/*/v* ]]; then
            pocket_id="$(echo "$ref" | cut -d'/' -f2)"
            version="$(echo "$ref" | cut -d'/' -f3)"   # v1.0.0
            mkdir -p "public/element-b/${pocket_id}/versions/${version}"
            cp -f "element-b/${pocket_id}/terms.md" "public/element-b/${pocket_id}/versions/${version}/terms.md"
            echo "${version}" > "public/element-b/${pocket_id}/VERSION"

          elif [[ "$ref" == element-a/* ]]; then
            pool_id="${ref#element-a/}"
            mkdir -p "public/element-a/${pool_id}"
            cp -f "element-a/${pool_id}/terms.md" "public/element-a/${pool_id}/terms.md"
            echo "${pool_id}" > "public/element-a/${pool_id}/VERSION"
          else
            echo "Tag no reconocido: ${ref}" >&2
            exit 1
          fi

      - name: Deploy to gh-pages (keep history)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          keep_files: true
