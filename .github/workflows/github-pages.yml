name: Publish Terms

on:
  push:
    tags:
      - 'element-a/*'
      - 'element-b/*/v*'
      - 'general/v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          touch public/.nojekyll

          ref="${GITHUB_REF_NAME}"

          if [[ "$ref" == general/v* ]]; then
            version="${ref#general/}"  # vX.Y.Z

            # Inmutable por versión
            mkdir -p "public/general/versions/${version}"
            cp -f "general/terms.md" "public/general/versions/${version}/terms.md"

            # Última (sin versión en el path)
            cp -f "public/general/versions/${version}/terms.md" "public/general/terms.md"
            printf '%s\n' "${version}" > "public/general/version.txt"

          elif [[ "$ref" == element-b/*/v* ]]; then
            pocket_id="$(echo "$ref" | cut -d'/' -f2)"
            version="$(echo "$ref" | cut -d'/' -f3)"  # vX.Y.Z

            # Inmutable por versión
            mkdir -p "public/element-b/${pocket_id}/versions/${version}"
            cp -f "element-b/${pocket_id}/terms.md" "public/element-b/${pocket_id}/versions/${version}/terms.md"

            # Última (sin versión en el path)
            cp -f "public/element-b/${pocket_id}/versions/${version}/terms.md" "public/element-b/${pocket_id}/terms.md"
            printf '%s\n' "${version}" > "public/element-b/${pocket_id}/version.txt"

          elif [[ "$ref" == element-a/* ]]; then
            pool_id="${ref#element-a/}"

            # Vigente por pool (sin versionado)
            mkdir -p "public/element-a/${pool_id}"
            cp -f "element-a/${pool_id}/terms.md" "public/element-a/${pool_id}/terms.md"

          else
            echo "Tag no reconocido: ${ref}" >&2
            exit 1
          fi

      - name: Compute integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BASE_URL="https://${OWNER}.github.io/${REPO}"
      
          if [[ "$ref" == general/v* ]]; then
            version="${ref#general/}"
            FILE="public/general/versions/${version}/terms.md"
            DEST_DIR_VERSION="public/general/versions/${version}"
            DEST_DIR_LATEST="public/general"
            element="general"
      
          elif [[ "$ref" == element-b/*/v* ]]; then
            folder="$(echo "$ref" | cut -d'/' -f2)"
            version="$(echo "$ref" | cut -d'/' -f3)"
            FILE="public/element-b/${folder}/versions/${version}/terms.md"
            DEST_DIR_VERSION="public/element-b/${folder}/versions/${version}"
            DEST_DIR_LATEST="public/element-b/${folder}"
            element="element-b"
      
          elif [[ "$ref" == element-a/* ]]; then
            folder="${ref#element-a/}"
            FILE="public/element-a/${folder}/terms.md"
            DEST_DIR_VERSION="public/element-a/${folder}"
            DEST_DIR_LATEST=""
            element="element-a"
            version="${folder}"
      
          else
            echo "Tag no reconocido: ${ref}" >&2
            exit 1
          fi
      
          [[ -f "$FILE" ]] || { echo "File not found: $FILE" >&2; exit 1; }
      
          # 🔹 Normalizar EOL a LF
          sed -i 's/\r$//' "$FILE"
      
          # 🔹 Forzar salto de línea al final si no existe
          tail -c1 "$FILE" | read -r _ || echo >> "$FILE"
      
          # Calcular hash en formato SRI
          B64=$(openssl dgst -sha256 -binary "$FILE" | base64)
          INTEGRITY="sha256-${B64}"
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REL_PATH="${FILE#public/}"
          URL="${BASE_URL}/${REL_PATH}"
      
          cat > "${DEST_DIR_VERSION}/integrity.json" <<EOF
          {
            "element": "${element}",
            "version": "${version}",
            "url": "${URL}",
            "mimetype": "text/markdown",
            "integrity": "${INTEGRITY}",
            "createdAt": "${TS}"
          }
          EOF
      
          if [[ -n "${DEST_DIR_LATEST}" ]]; then
            cp -f "${DEST_DIR_VERSION}/integrity.json" "${DEST_DIR_LATEST}/integrity.json"
          fi

      - name: Deploy to gh-pages (keep history)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          keep_files: true